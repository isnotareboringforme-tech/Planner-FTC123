<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Open City</title>
<style>
  :root { --hi: #5ef0d0; --bg: rgba(8,12,22,.62); --line: rgba(255,255,255,.18); --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 5px rgba(0,0,0,.7); }
  #hud[hidden], #touch[hidden] { display: none; }
  .pill { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  /* top-left: minimap + clock */
  #tl { position: absolute; top: calc(10px + var(--sat)); left: calc(10px + var(--sal)); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  #mm { width: 132px; height: 132px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: #111; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
  #clock { font-weight: 700; font-size: .95rem; padding: 3px 10px; }
  /* top-right: money + buttons */
  #tr { position: absolute; top: calc(10px + var(--sat)); right: calc(10px + var(--sar)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #money { font-weight: 800; font-size: 1.3rem; color: #9bff9b; padding: 4px 12px; letter-spacing: .5px; }
  #topbtns { display: flex; gap: 6px; pointer-events: auto; }
  #topbtns button { width: 42px; height: 42px; border-radius: 12px; font-size: 1.05rem; color: #fff; cursor: pointer; }
  #bars { display: grid; grid-template-columns: auto 120px; gap: 4px 8px; align-items: center; font-size: .72rem; font-weight: 700; padding: 8px 10px; }
  .bar { height: 8px; border-radius: 5px; background: rgba(255,255,255,.18); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; border-radius: 5px; transition: width .12s linear; }
  #hpb i { background: linear-gradient(90deg, #ff5a6a, #ff9a8a); }
  #stb i { background: linear-gradient(90deg, #4cc2ff, #8be0ff); }
  #cab i { background: linear-gradient(90deg, #ffb13b, #ffd98a); }
  #obj { position: absolute; top: calc(10px + var(--sat)); left: 50%; transform: translateX(-50%); max-width: min(46vw, 420px); text-align: center; padding: 6px 14px; font-size: .88rem; font-weight: 600; }
  #obj small { display: block; opacity: .75; font-weight: 500; font-size: .72rem; }
  #prompt { position: absolute; left: 50%; bottom: calc(26% + var(--sab)); transform: translateX(-50%); padding: 8px 16px; font-weight: 700; font-size: .95rem; opacity: 0; transition: opacity .15s; white-space: nowrap; }
  #prompt.on { opacity: 1; }
  #toast { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -8px); padding: 10px 18px; font-weight: 700; opacity: 0; transition: opacity .25s, transform .25s; text-align: center; max-width: 80vw; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  /* speedometer */
  #spd { position: absolute; right: calc(14px + var(--sar)); bottom: calc(14px + var(--sab)); text-align: right; padding: 8px 14px; display: none; min-width: 130px; }
  body.incar #spd { display: block; }
  #spd b { font-size: 2.3rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #spd span { font-size: .8rem; opacity: .8; margin-left: 4px; }
  #rpm { height: 6px; background: rgba(255,255,255,.2); border-radius: 4px; margin: 6px 0 2px; overflow: hidden; }
  #rpm i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5ef0d0, #ffd166 70%, #ff4d5a); }
  #gear { font-size: .78rem; font-weight: 700; opacity: .9; }
  body.touch #spd { bottom: auto; top: calc(150px + var(--sat)); right: calc(10px + var(--sar)); min-width: 0; padding: 6px 10px; }
  body.touch #spd b { font-size: 1.6rem; }
  #keys { position: absolute; left: calc(14px + var(--sal)); bottom: calc(12px + var(--sab)); font-size: .72rem; opacity: .7; padding: 6px 10px; line-height: 1.5; }
  body.touch #keys { display: none; }

  /* touch controls */
  #touch { position: fixed; inset: 0; pointer-events: none; }
  .zone { position: absolute; pointer-events: auto; touch-action: none; }
  #zl { left: 0; top: 34%; bottom: 0; width: 46%; }
  #zr { right: 0; top: 0; bottom: 0; width: 54%; }
  #joy { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(255,255,255,.1); opacity: 0; transition: opacity .15s; pointer-events: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.4); border: 2px solid rgba(255,255,255,.75); }
  #joyhint { position: absolute; left: 24px; bottom: calc(40px + var(--sab)); width: 96px; height: 96px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.28); pointer-events: none; display: grid; place-content: center; font-size: .65rem; opacity: .7; }
  .tb { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); background: rgba(255,255,255,.14); color: #fff; font: 800 .74rem system-ui, sans-serif; display: grid; place-content: center; text-shadow: 0 1px 4px rgba(0,0,0,.7); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); padding: 0; }
  .tb.down { background: rgba(94,240,208,.4); border-color: var(--hi); }
  .tb[hidden] { display: none; }
  #bJump { right: calc(22px + var(--sar)); bottom: calc(70px + var(--sab)); width: 86px; height: 86px; font-size: .85rem; }
  #bSprint { right: calc(122px + var(--sar)); bottom: calc(40px + var(--sab)); width: 64px; height: 64px; }
  #bCrouch { right: calc(30px + var(--sar)); bottom: calc(170px + var(--sab)); width: 56px; height: 56px; }
  #bUse { right: calc(100px + var(--sar)); bottom: calc(125px + var(--sab)); width: 70px; height: 70px; background: rgba(94,240,208,.3); border-color: var(--hi); }
  #bGas { right: calc(22px + var(--sar)); bottom: calc(60px + var(--sab)); width: 92px; height: 92px; background: rgba(60,220,120,.3); border-color: #6dffa8; }
  #bBrake { right: calc(124px + var(--sar)); bottom: calc(46px + var(--sab)); width: 74px; height: 74px; background: rgba(255,70,80,.3); border-color: #ff8a92; }
  #bHB { right: calc(34px + var(--sar)); bottom: calc(166px + var(--sab)); width: 58px; height: 58px; }
  #bHorn { right: calc(100px + var(--sar)); bottom: calc(210px + var(--sab)); width: 46px; height: 46px; }

  /* overlay menu */
  #menu { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 30%, rgba(20,35,70,.78), rgba(2,4,10,.92)); padding: calc(12px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal)); overflow: auto; touch-action: pan-y; z-index: 10; }
  #menu[hidden] { display: none; }
  .card { width: min(560px, 100%); max-height: 100%; overflow: auto; background: rgba(12,18,34,.9); border: 1px solid var(--line); border-radius: 20px; padding: 20px 20px 16px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .card h1 { margin: 0; font-size: 2.1rem; letter-spacing: 2px; font-weight: 900; background: linear-gradient(90deg, #5ef0d0, #ffd166); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card .sub { margin: 2px 0 14px; opacity: .75; font-size: .85rem; }
  .card h3 { margin: 16px 0 6px; font-size: .78rem; letter-spacing: 1.5px; text-transform: uppercase; opacity: .7; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button, .btn { border: 1.5px solid var(--line); background: rgba(255,255,255,.07); color: #fff; border-radius: 99px; padding: 9px 14px; font: 600 .86rem system-ui, sans-serif; min-height: 42px; cursor: pointer; }
  .chips button.on { background: var(--hi); color: #06121a; border-color: var(--hi); }
  .btn.big { width: 100%; background: linear-gradient(90deg, #5ef0d0, #8be0ff); color: #06121a; border: 0; font-size: 1.05rem; font-weight: 800; padding: 14px; margin-top: 4px; }
  .row { display: flex; align-items: center; gap: 10px; font-size: .88rem; }
  .row input[type=range] { flex: 1; }
  #tests { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .85rem; }
  #tests li { display: flex; gap: 8px; padding: 6px 10px; background: rgba(255,255,255,.05); border-radius: 10px; }
  #tests li.ok { background: rgba(94,240,208,.16); }
  #tests li.ok span:last-child { text-decoration: line-through; opacity: .65; }
  .help { font-size: .8rem; opacity: .75; line-height: 1.5; margin: 6px 0 0; }
  .err { color: #ff9a9a; font-weight: 700; }
  @media (max-height: 460px) { #mm { width: 96px; height: 96px; } #bars { display: none; } .card h1 { font-size: 1.5rem; } }
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>

<div id="hud" hidden>
  <div id="tl"><canvas id="mm" width="264" height="264"></canvas><div id="clock" class="pill">9:00 AM</div></div>
  <div id="obj" class="pill"><span id="objt">Look around</span><small id="objs"></small></div>
  <div id="tr">
    <div id="money" class="pill">$0</div>
    <div id="bars" class="pill"><span>HP</span><div class="bar" id="hpb"><i></i></div><span>STA</span><div class="bar" id="stb"><i></i></div><span id="cal" hidden>CAR</span><div class="bar" id="cab" hidden><i></i></div></div>
    <div id="topbtns"><button class="pill" id="bSnd" aria-label="Sound">🔊</button><button class="pill" id="bPause" aria-label="Menu">☰</button></div>
  </div>
  <div id="spd" class="pill"><b id="mph">0</b><span>mph</span><div id="rpm"><i></i></div><div id="gear">N</div></div>
  <div id="keys" class="pill">WASD move · Shift sprint · Space jump · C crouch · E enter/exit car<br>Mouse look (click the game) · Esc menu</div>
  <div id="prompt" class="pill"></div>
  <div id="toast" class="pill"></div>
</div>

<div id="touch" hidden>
  <div class="zone" id="zl"><div id="joy"><i></i></div></div>
  <div class="zone" id="zr"></div>
  <div id="joyhint">MOVE</div>
  <button class="tb" id="bJump">JUMP</button>
  <button class="tb" id="bSprint">RUN</button>
  <button class="tb" id="bCrouch">DUCK</button>
  <button class="tb" id="bUse" hidden>ENTER</button>
  <button class="tb" id="bGas" hidden>GAS</button>
  <button class="tb" id="bBrake" hidden>BRAKE</button>
  <button class="tb" id="bHB" hidden>HAND<br>BRAKE</button>
  <button class="tb" id="bHorn" hidden>📯</button>
</div>

<div id="menu">
  <div class="card" id="mcard">
    <h1>OPEN CITY</h1>
    <p class="sub">Stage 1 · Foundation: city, character, one drivable car</p>
    <div id="mbody"></div>
  </div>
</div>

<script type="module" src="city-game.js"></script>
</body>
</html>
